spring:
  datasource:
#    url: jdbc:mysql://localhost:3306/devc?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
#    username: devc
#    password: devc1234
#    driver-class-name: com.mysql.cj.jdbc.Driver

  application:
    name: p-24-260305

  profiles:
    active: dev

  output:
    ansi:
      enabled: always

  thymeleaf:
    cache: false
    prefix: file:src/main/resources/templates/

  mvc:
    hiddenmethod:
      filter:
        enabled: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

springdoc:
  default-produces-media-type: application/json; charset=UTF-8

logging:
  level:
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.orm.jdbc.extract: WARN
    org.springframework.transaction.interceptor: WARN
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR
    org.hibernate.SQL: WARN
    com.zaxxer.hikari: WARN
    com.back: INFO

custom:
  oauth2:
    frontend-success-url: ${FRONTEND_BASE_URL:http://localhost:3000}/oauth/callback
    frontend-failure-url: ${FRONTEND_BASE_URL:http://localhost:3000}/login
    frontend-signup-url: ${FRONTEND_BASE_URL:http://localhost:3000}/oauth/signup
    allowed-redirect-uris: ${FRONTEND_BASE_URL:http://localhost:3000}/login,${FRONTEND_BASE_URL:http://localhost:3000}/oauth/signup,${FRONTEND_BASE_URL:http://localhost:3000}/oauth/callback

  cors:
    allowed-origins: ${FRONTEND_BASE_URL:http://localhost:3000}

  jwt:
    secret-key: "QkFzZv1faT1CmjVCThXvSf+/m+5jVqwaqPB5MqLpFPvpYwDj6kIQhnjrFn47eM4PLiL9bkRYwc2ILoy/9b2zhg=="
    access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
    access-cookie-name: ${JWT_ACCESS_COOKIE_NAME:access_token}
    access-cookie-secure: ${JWT_ACCESS_COOKIE_SECURE:false}
    access-cookie-same-site: ${JWT_ACCESS_COOKIE_SAME_SITE:Lax}

